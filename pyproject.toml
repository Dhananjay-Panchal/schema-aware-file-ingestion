[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-aware-file-ingestion"
version = "0.1.0"
description = "Config-driven CSV and Excel ingestion with validation, quarantine and idempotent loads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
ingest-file = "file_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

